name: Build ImmortalWrt R4AC 100M

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses-dev libssl-dev git gawk gettext python3 python3-pip unzip bzip2

      - name: Clone Source
        run: |
          git clone https://github.com/immortalwrt/immortalwrt
          cd immortalwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Build Config
        run: |
          cd immortalwrt
          cat > .config << EOF
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt76x8=y
          CONFIG_TARGET_ramips_mt76x8_DEVICE_xiaomi_mi-router-4a-100m=y
          CONFIG_GOLANG=y
          CONFIG_PKG_GOLANG_VERSION_1_26=y
          CONFIG_LUCI_LANG_en=y
          CONFIG_PACKAGE_luci=y
          EOF

      - name: Compile Firmware
        run: |
          cd immortalwrt
          make defconfig
          make -j$(nproc) V=s

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: Firmware
          path: immortalwrt/bin/targets/ramips/mt76x8/*.bin
